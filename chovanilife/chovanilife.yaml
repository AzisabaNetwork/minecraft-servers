apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-chovanilife
spec:
  selector:
    matchLabels:
      app: server-chovanilife
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: server-chovanilife
        stage: production
        kuvel.azisaba.net/enable-server-discovery: "true"
        kuvel.azisaba.net/preferred-server-name: chovanilife
        kuvel.azisaba.net/disable-load-balancer: "true"
        kuvel.azisaba.net/disable-name-suffix: "true"
    spec:
      nodeName: saba17
      containers:
        - name: server-chovanilife
          image: itzg/minecraft-server:java25
          workingDir: /data
          imagePullPolicy: Always
          resources:
            requests:
              memory: "16Gi"
            limits:
              memory: "24Gi"
          ports:
            - containerPort: 25565
            - containerPort: 8085
          env:
            # タイムゾーン
            - name: TZ
              value: "Asia/Tokyo"
            # EULAに同意する
            - name: EULA
              value: "true"
            # サーバーの種類
            - name: TYPE
              value: CUSTOM
            - name: CUSTOM_SERVER
              value: "chovanilife.jar"
            # 最適化されたJVMフラグを使用する
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ONLINE_MODE
              value: "false"
            # Minecraftバージョン
            - name: VERSION
              value: "26.3"
            # 初期・最大メモリ
            - name: MEMORY
              value: 16G
            - name: JVM_OPTS
              value: "--enable-native-access=ALL-UNNAMED -XX:+UseCompactObjectHeaders"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: server-chovanilife-db
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server-chovanilife-db
                  key: password
            # yml内のCFG_なんとかを置き換えるためのもの
            - name: ENV_VARIABLE_PREFIX
              value: "CFG_"
            # メタデータ(サーバー内で環境変数で取得可能)
            - name: CFG_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CFG_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CFG_SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['kuvel.azisaba.net/preferred-server-name']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['kuvel.azisaba.net/preferred-server-name']
          startupProbe:
            tcpSocket:
              port: 25565
            failureThreshold: 60 # 600秒
            periodSeconds: 10
          volumeMounts:
            - name: server-data
              mountPath: /data
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: server-chovanilife-data-claim
      priorityClassName: minecraft-other-server
      terminationGracePeriodSeconds: 60 # 1分
---
apiVersion: v1
kind: Service
metadata:
  name: server-chovanilife-svc
spec:
  type: ClusterIP
  selector:
    app: server-chovanilife
    stage: production
  ports:
    - port: 25565
      targetPort: 25565
---
apiVersion: v1
kind: Service
metadata:
  name: server-chovanilife-pack-svc
spec:
  type: ClusterIP
  selector:
    app: server-chovanilife
    stage: production
  ports:
    - port: 8085
      targetPort: 8085
