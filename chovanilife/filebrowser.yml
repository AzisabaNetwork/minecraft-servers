apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser-chovanilife
  namespace: minecraft
spec:
  selector:
    matchLabels:
      app: filebrowser-chovanilife
  replicas: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: filebrowser-chovanilife
    spec:
      # サーバー本体と同じsaba17のローカルディスクを扱うため、同じノードに固定する
      nodeName: saba17
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: filebrowser-chovanilife
          image: filebrowser/filebrowser
          volumeMounts:
            - mountPath: /database
              name: filebrowser-database
            - mountPath: /config
              name: filebrowser-config
            - mountPath: /srv/chovanilife
              name: chovanilife-data
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "500Mi"
          ports:
            - containerPort: 8080
      volumes:
        # 事前にsaba17で mkdir -p /srv/filebrowser-chovanilife && chown 1000:1000 /srv/filebrowser-chovanilife
        - name: filebrowser-database
          hostPath:
            path: /srv/filebrowser-chovanilife
            type: Directory
        - name: filebrowser-config
          configMap:
            name: filebrowser-chovanilife-config
            items:
              - key: settings.json
                path: settings.json
        - name: chovanilife-data
          hostPath:
            path: /srv/chovanilife
            type: Directory
      # priorityClassName: minecraft-other-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-chovanilife-config
data:
  settings.json: |
    {
      "port": 8080,
      "baseURL": "",
      "address": "",
      "log": "stdout",
      "database": "/database/filebrowser.db",
      "root": "/srv"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser-chovanilife-svc
spec:
  type: ClusterIP
  selector:
    app: filebrowser-chovanilife
  ports:
    - port: 80
      targetPort: 8080
