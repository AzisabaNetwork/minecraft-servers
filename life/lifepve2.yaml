apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-lifepve2
spec:
  selector:
    matchLabels:
      app: server-lifepve2
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: server-lifepve2
        stage: production
        kuvel.azisaba.net/enable-server-discovery: "true"
        kuvel.azisaba.net/preferred-server-name: lifepve2
        kuvel.azisaba.net/disable-load-balancer: "true"
        kuvel.azisaba.net/disable-name-suffix: "true"
    spec:
      nodeName: saba12
      initContainers:
      # 共有ベース(/srv/lifepve)は読み取り専用なので、Paper が起動時に書き込むパスだけを
      # このサーバー専用の書き込み可能ボリューム (/srv/lifepve2) に用意する。
      # 既に中身があれば触らないので、2回目以降の起動はほぼ何もしない。
      - name: seed-paper-writable
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -eu
          start=$(date +%s)

          # ファイル: 実体が無いときだけベースからコピーする。
          # kubelet は subPath が無いと空ディレクトリを先に作るので、それは消してから置く。
          seed_file() {
            src="$1"
            dst="$2"
            if [ -d "$dst" ]; then
              if [ -n "$(ls -A "$dst")" ]; then
                echo "WARN: $dst is a non-empty directory, leaving it" >&2
                return 0
              fi
              rmdir "$dst"
            fi
            if [ -s "$dst" ]; then
              return 0
            fi
            if [ -s "$src" ]; then
              cp -f "$src" "$dst"
            else
              : > "$dst"
            fi
          }

          # ディレクトリ: 空のときだけベースから中身をコピーする
          seed_dir() {
            src="$1"
            dst="$2"
            mkdir -p "$dst"
            if [ -n "$(ls -A "$dst")" ]; then
              return 0
            fi
            if [ -d "$src" ]; then
              # 属性保持に失敗する環境でも中身はコピーしたいので fallback する
              cp -a "$src/." "$dst/" 2>/dev/null || cp -R "$src/." "$dst/"
            fi
          }

          # Paper が起動時に上書きするファイル
          for f in bukkit.yml spigot.yml commands.yml help.yml; do
            seed_file "/base/$f" "/data/$f"
          done
          # Paper が起動時に上書きするディレクトリ
          # libraries: SpigotLibraryLoader がプラグインの依存をダウンロードする
          # versions/cache: paperclip が Paper jar を展開・キャッシュする
          for d in config crash-reports libraries versions cache; do
            seed_dir "/base/$d" "/data/$d"
          done

          # プラグインが書き込む状態ディレクトリ。RAID 側をマウントしているので
          # 初回だけベースから内容を引き継ぐ (以降は各サーバー専用の状態になる)
          for d in BuildToolPlus/playerdata CraftGUI/playerdata CraftGUI/logs \
                   CratesPlus ImageOnMap/maps AdvancementFilter; do
            seed_dir "/base/plugins/$d" "/raid/plugins/$d"
          done

          echo "Seeded Paper writable paths in $(( $(date +%s) - start ))s"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "2000m"
            memory: "512Mi"
        volumeMounts:
        - name: server-data
          mountPath: /base
          readOnly: true
        - name: pve2-data
          mountPath: /data
        - name: raid-storage
          mountPath: /raid
      containers:
      - name: server-lifepve2
        # Dockerイメージの指定
        # java11の11の部分を8にしたり17にしたりなど、Minecraftバージョンによって適宜変えてください
        # Javaバージョン早見表
        # 1.14.4以下 ... 8
        # 1.15.x ... 8-11 (9-10はサポート終了)
        # 1.16.x ... 11-16 (12-16はサポート終了)
        # 1.17.x ... 16-17 (16はサポート終了)
        # 1.18.x～1.20.4 ... 17
        # 1.20.5以降 ... 21
        image: itzg/minecraft-server:java25
        workingDir: /data
        # 毎回のイメージ取得を避ける(更新したいときは一時的に Always にするか、ノードで docker/crictl pull する)
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "8Gi"
          limits:
            memory: "12Gi"
        ports:
          - containerPort: 25565
        env:
          # タイムゾーン
          - name: TZ
            value: "Asia/Tokyo"
          # EULAに同意する
          - name: EULA
            value: "true"
          # サーバーの種類
          - name: TYPE
            value: PAPER
          - name: PAPER_BUILD
            value: "132"
          # 最適化されたJVMフラグを使用する
          - name: USE_AIKAR_FLAGS
            value: "true"
          # スポーン保護
          - name: SPAWN_PROTECTION
            value: "0"
          # オンラインモード
          - name: ONLINE_MODE
            value: "false"
          # コマンドブロックを有効にする
          - name: ENABLE_COMMAND_BLOCK
            value: "true"
          # ネザーを有効にする
          - name: ALLOW_NETHER
            value: "false"
          # "Flying is not enabled on this server"を無効にする
          - name: ALLOW_FLIGHT
            value: "true"
          # 描画距離
          - name: VIEW_DISTANCE
            value: "10"
          # 統計情報をMojangに送信する
          - name: SNOOPER_ENABLED
            value: "false"
          # プレイヤーの実績・進捗解除を全体チャットに流す
          - name: ANNOUNCE_PLAYER_ACHIEVEMENTS
            value: "false"
          # 最大人数
          - name: MAX_PLAYERS
            value: "1000"
          # UID
          - name: UID
            value: "0"
          # GID
          - name: GID
            value: "1012"
          # Minecraftバージョン
          - name: VERSION
            value: 1.21.11
          # 初期・最大メモリ
          - name: MEMORY
            value: 8G # change to 10G after lifetown closes
          # ホワイトリスト
          - name: ENABLE_WHITELIST
            value: "false"
          # JVM -Dオプション
          #- name: JVM_DD_OPTS
          #  value: "log4j2Fix.loadReflectionUtil:true"
          # JVMオプション
          - name: JVM_OPTS
            value: "-DPaper.ignoreWorldDataVersion=true -DPaper.IgnoreJavaVersion=true -XX:+UseCompactObjectHeaders"
          # 共有ベース由来の libraries を削除対象にしない
          - name: CLEAN_SERVER_LIBRARIES
            value: "false"
          # yml内のCFG_なんとかを置き換えるためのもの
          - name: ENV_VARIABLE_PREFIX
            value: "CFG_"
          # メタデータ(サーバー内で環境変数で取得可能)
          - name: CFG_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: CFG_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: CFG_SERVER_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['kuvel.azisaba.net/preferred-server-name']
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: SERVER_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['kuvel.azisaba.net/preferred-server-name']
        startupProbe:
          tcpSocket:
            port: 25565
          failureThreshold: 60 # 600秒
          periodSeconds: 10
        volumeMounts:
        # 共有ベース(/srv/lifepve)は読み取り専用。書き込みが必要なパスだけ個別に上書きする
        - name: server-data
          mountPath: /data
          readOnly: true
        # Paper が起動時に書き込むパス (読み取り専用のままだと EROFS で起動できない)
        - name: pve2-data
          mountPath: /data/config
          subPath: config
        - name: pve2-data
          mountPath: /data/crash-reports
          subPath: crash-reports
        # SpigotLibraryLoader が依存ライブラリをダウンロードする
        - name: pve2-data
          mountPath: /data/libraries
          subPath: libraries
        # paperclip が Paper jar を展開・キャッシュする
        - name: pve2-data
          mountPath: /data/versions
          subPath: versions
        - name: pve2-data
          mountPath: /data/cache
          subPath: cache
        - name: pve2-data
          mountPath: /data/plugins/.paper-remapped
          subPath: plugins/.paper-remapped
        - name: pve2-data
          mountPath: /data/bukkit.yml
          subPath: bukkit.yml
        - name: pve2-data
          mountPath: /data/spigot.yml
          subPath: spigot.yml
        - name: pve2-data
          mountPath: /data/commands.yml
          subPath: commands.yml
        - name: pve2-data
          mountPath: /data/help.yml
          subPath: help.yml
        - name: raid-storage-pve-plugins
          mountPath: /mnt/raid/srv/lifepve/plugins
          readOnly: true
        - name: server-data
          mountPath: /data/plugins/MythicMobs
          subPath: plugins/MythicMobs
        - name: itemfixer-data
          mountPath: /data/plugins/ItemFixer
          readOnly: true
        - name: pve2-data
          mountPath: /data/.rcon-cli.env
          subPath: .rcon-cli.env
        - name: pve2-data
          mountPath: /data/.rcon-cli.yaml
          subPath: .rcon-cli.yaml
        - name: pve2-data
          mountPath: /data/.paper.env
          subPath: .paper.env
        - name: pve2-data
          mountPath: /data/.papermc-manifest.json
          subPath: .papermc-manifest.json
        - name: pve2-data
          mountPath: /data/ops.json
          subPath: ops.json
        - name: pve2-data
          mountPath: /data/worlds
          subPath: worlds
        - name: pve2-data
          mountPath: /data/server.properties
          subPath: server.properties
        - name: raid-storage
          mountPath: /data/logs
          subPath: logs
        - name: raid-storage
          mountPath: /data/plugins/PlayerIgnore
          subPath: plugins/PlayerIgnore
        - name: pve2-data
          mountPath: /data/plugins/MythicMobs/Error Logs
          subPath: plugins/MythicMobs/Error Logs
        - name: raid-storage
          mountPath: /data/plugins/TAB
          subPath: plugins/TAB
        - name: raid-storage
          mountPath: /data/plugins/LunaChat
          subPath: plugins/LunaChat
        - name: raid-storage
          mountPath: /data/plugins/BuycraftX
          subPath: plugins/BuycraftX
        - name: raid-storage
          mountPath: /data/plugins/Shopkeepers
          subPath: plugins/Shopkeepers
        # Essentials は usermap.bin / uuids.bin をディレクトリ直下に書くので
        # userdata だけでなくディレクトリ全体を RAID 側に置く
        - name: raid-storage
          mountPath: /data/plugins/Essentials
          subPath: plugins/Essentials
        - name: raid-storage
          mountPath: /data/plugins/BuildToolPlus/playerdata
          subPath: plugins/BuildToolPlus/playerdata
        - name: raid-storage
          mountPath: /data/plugins/CraftGUI/playerdata
          subPath: plugins/CraftGUI/playerdata
        - name: raid-storage
          mountPath: /data/plugins/CraftGUI/logs
          subPath: plugins/CraftGUI/logs
        - name: raid-storage
          mountPath: /data/plugins/CratesPlus
          subPath: plugins/CratesPlus
        - name: raid-storage
          mountPath: /data/plugins/ImageOnMap/maps
          subPath: plugins/ImageOnMap/maps
        - name: raid-storage
          mountPath: /data/plugins/AdvancementFilter
          subPath: plugins/AdvancementFilter
        - name: server-data
          mountPath: /data/plugins/ScriptBlockPlus
          subPath: plugins/ScriptBlockPlus
          readOnly: true
        - name: raid-storage
          mountPath: /data/plugins/ScriptBlockPlus/json/playercount
          subPath: plugins/ScriptBlockPlus/json/playercount
        - name: raid-storage
          mountPath: /data/plugins/JoinNotifier
          subPath: plugins/JoinNotifier
        - name: raid-storage
          mountPath: /data/plugins/LifeCore
          subPath: plugins/LifeCore
        - name: raid-storage
          mountPath: /data/plugins/AzisabaAPI
          subPath: plugins/AzisabaAPI
        - name: raid-storage
          mountPath: /data/plugins/PlayerLimit
          subPath: plugins/PlayerLimit
        - name: raid-storage
          mountPath: /data/plugins/FastAsyncWorldEdit
          subPath: plugins/FastAsyncWorldEdit
        - name: raid-storage
          mountPath: /data/plugins/AzisabaAds
          subPath: plugins/AzisabaAds
        - name: tab-config
          mountPath: /plugins/TAB/config.yml
          subPath: config.yml
        - name: raid-storage
          mountPath: /mnt/raid/srv/lifepve2
      volumes:
      - name: server-data
        hostPath:
          path: /srv/lifepve
          type: Directory
      - name: itemfixer-data
        hostPath:
          path: /srv/life/plugins/ItemFixer
          type: Directory
      - name: pve2-data
        hostPath:
          path: /srv/lifepve2
          type: Directory
      - name: tab-config
        configMap:
          name: common-life-server-tab-config-with-pvelevel
      - name: raid-storage
        hostPath:
          path: /mnt/raid/srv/lifepve2
          type: Directory
      - name: raid-storage-pve-plugins
        hostPath:
          path: /mnt/raid/srv/lifepve/plugins
          type: Directory
      priorityClassName: minecraft-other-server
      terminationGracePeriodSeconds: 60 # 1分
---
apiVersion: v1
kind: Service
metadata:
  name: server-lifepve2-svc
spec:
  type: ClusterIP
  selector:
    app: server-lifepve2
    stage: production
  ports:
    - port: 25565
      targetPort: 25565
---
apiVersion: v1
kind: Service
metadata:
  name: server-lifepve2-prometheus-exporter-svc
spec:
  type: ClusterIP
  selector:
    app: server-lifepve2
    stage: production
  ports:
    - port: 9225
      targetPort: 9225
